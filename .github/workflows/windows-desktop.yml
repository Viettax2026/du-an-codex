name: Build Windows desktop
on:
  # Explicit owner-requested releases only. The desktop registration change
  # follows the owner's newer instruction for Windows; web approval remains
  # covered by regression tests. Normal main pushes never build Windows.
  push:
    tags: ['windows-vps-tested-0a81960', 'windows-self-registration-f419728', 'windows-owner-package-20261030-r2']
  workflow_dispatch:
    inputs:
      vps_tested:
        description: 'Confirm this exact revision has been tested successfully on the VPS before building Windows'
        required: true
        type: boolean
        default: false
      license_config:
        description: 'Public client-config.json from the owner license server (never a private key)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  windows:
    if: ${{ inputs.vps_tested == true || (github.event_name == 'push' && (github.ref == 'refs/tags/windows-vps-tested-0a81960' || github.ref == 'refs/tags/windows-self-registration-f419728' || github.ref == 'refs/tags/windows-owner-package-20261030-r2')) }}
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/tags/windows-vps-tested-0a81960' && '0a819608efffecd3dd4efaaf1a4d41448e2cef36' || github.ref == 'refs/tags/windows-self-registration-f419728' && 'f4197288d9334438129e8cb27da45de4acc5f38c' || github.ref == 'refs/tags/windows-owner-package-20261030-r2' && '73f38a058680535486990dfcc1a4890ae4e2726e' || github.sha }}
          persist-credentials: false
      - name: Record approved release revision
        shell: pwsh
        run: |
          $source = git rev-parse HEAD
          if ('${{ github.event_name }}' -eq 'push') {
            switch ('${{ github.ref }}') {
              'refs/tags/windows-vps-tested-0a81960' { $expectedSource = '0a819608efffecd3dd4efaaf1a4d41448e2cef36' }
              'refs/tags/windows-self-registration-f419728' { $expectedSource = 'f4197288d9334438129e8cb27da45de4acc5f38c' }
              'refs/tags/windows-owner-package-20261030-r2' { $expectedSource = '73f38a058680535486990dfcc1a4890ae4e2726e' }
              default { throw 'Not an owner-approved Windows release.' }
            }
            if ($source -ne $expectedSource) { throw 'Release source does not match the approved revision.' }
          }
          "Application source: $source" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - name: Test pinned Zalo SDK text and document delivery without live sends
        shell: pwsh
        working-directory: connector
        run: |
          npm.cmd ci --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdkLog = Join-Path $env:RUNNER_TEMP 'zaloflow-sdk-tests.log'
          $ErrorActionPreference = 'Continue'
          npm.cmd test -- --test-reporter=tap 2>&1 | Tee-Object -FilePath $sdkLog
          $sdkExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          '### Offline pinned SDK tests' >> $env:GITHUB_STEP_SUMMARY
          '```text' >> $env:GITHUB_STEP_SUMMARY
          Get-Content $sdkLog >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if ($sdkExit -ne 0) {
            $sdkDiagnostic = Get-Content $sdkLog -Raw
            if ($sdkDiagnostic.Length -gt 50000) { $sdkDiagnostic = $sdkDiagnostic.Substring($sdkDiagnostic.Length - 50000) }
            $sdkDiagnostic = $sdkDiagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Offline SDK diagnostics::$sdkDiagnostic"
            exit $sdkExit
          }
      - name: Install desktop dependencies and test Windows lifecycle
        shell: pwsh
        run: |
          python -m pip install -r desktop/requirements.txt pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_auth.py tests/test_account_approval.py tests/test_account_recovery.py tests/test_desktop_registration.py tests/test_desktop_runtime.py tests/test_license_system.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read public license configuration
        id: license_config
        env:
          ZALOFLOW_CLIENT_CONFIG: ${{ inputs.license_config }}
        run: python -m desktop.configure_build
      - name: Build native Windows package
        shell: pwsh
        run: ./desktop/build-windows.ps1 -AllowUnconfigured
      - name: Verify bundled public license configuration
        if: steps.license_config.outputs.configured == 'true'
        shell: pwsh
        run: |
          $expected = Get-Content desktop/license-config.json -Raw | ConvertFrom-Json
          $bundled = Get-Content desktop/dist/ZaloFlow/_internal/desktop/license-config.json -Raw | ConvertFrom-Json
          if ($bundled.version -ne $expected.version -or $bundled.server_url -ne $expected.server_url -or $bundled.public_key -ne $expected.public_key) { throw 'The packaged license authority does not match the owner configuration.' }
          $privateFiles = Get-ChildItem desktop/dist/ZaloFlow -Recurse -File | Where-Object { $_.Name -in @('signing-private.pem', 'admin-password.txt', 'session-secret.txt', 'licenses.sqlite3') }
          if ($privateFiles) { throw 'Private authority data must never be included in the customer package.' }
      - name: Smoke test packaged web server, scheduler and bundled Node
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'zaloflow-smoke.json'
          $process = Start-Process desktop/dist/ZaloFlow/ZaloFlow.exe -ArgumentList @('--smoke-test', '--smoke-report', $reportPath) -PassThru
          if (-not $process.WaitForExit(90000)) { Stop-Process -Id $process.Id -Force; throw 'Packaged smoke test timed out.' }
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke test failed.' }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.stopped -or -not $report.node_available -or -not $report.licensed -or -not $report.password_recovery -or -not $report.self_registration) { throw 'Incomplete smoke test.' }
          Get-Content $reportPath
      - name: Smoke test native Edge WebView2 window
        shell: pwsh
        run: |
          $runtimePath = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/EdgeWebView/Application'
          if (-not (Test-Path $runtimePath)) {
            choco install webview2-runtime --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install WebView2 for GUI smoke test.' }
          }
          $reportPath = Join-Path $env:RUNNER_TEMP 'zaloflow-gui-smoke.json'
          $process = Start-Process desktop/dist/ZaloFlow/ZaloFlow.exe -ArgumentList @('--smoke-test', '--smoke-gui', '--smoke-report', $reportPath) -PassThru
          try {
            if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id -Force; throw 'Native window did not close.' }
            if ($process.ExitCode -ne 0) { throw 'Native Windows GUI smoke test failed.' }
          } catch {
            if (Test-Path "$reportPath.log") {
              $diagnostic = (Get-Content "$reportPath.log" -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Native window diagnostics::$diagnostic"
            }
            throw
          } finally {
            if (Test-Path "$reportPath.log") {
              Get-Content "$reportPath.log"
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content "$reportPath.log" >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.gui -or -not $report.stopped) { throw 'Incomplete GUI smoke test.' }
          Get-Content $reportPath
      - name: Build single-file Windows installer
        shell: pwsh
        run: |
          $compilerPath = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compilerPath)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install Inno Setup 6.' }
          }
          ./desktop/build-installer.ps1 -AppVersion "1.0.${{ github.run_number }}"
          $source = git rev-parse HEAD
          "ZaloFlow Windows x64`nApplication source: $source`nInstaller version: 1.0.${{ github.run_number }}`n" | Set-Content desktop/dist/installer/SOURCE.txt -Encoding utf8
      - name: Test installer, shortcuts, upgrade and uninstall on Windows
        shell: pwsh
        run: ./desktop/test-installer.ps1
      - name: Prepare owner-requested complete public download
        if: github.ref == 'refs/tags/windows-owner-package-20261030-r2'
        shell: pwsh
        env:
          RELEASE_WORKFLOW_REF: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$env:RELEASE_WORKFLOW_REF"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch release packaging metadata.' }
          $packager = Join-Path $env:RUNNER_TEMP 'zaloflow-package-release.py'
          $env:ZALOFLOW_RELEASE_PACKAGER = $packager
          python -c "import os,pathlib,subprocess; pathlib.Path(os.environ['ZALOFLOW_RELEASE_PACKAGER']).write_bytes(subprocess.check_output(['git','show',os.environ['RELEASE_WORKFLOW_REF']+':release_tools/package_windows.py']))"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot load release packaging tools.' }
          python $packager --workflow-ref "$env:RELEASE_WORKFLOW_REF" --installer-dir desktop/dist/installer --output "$env:RUNNER_TEMP/zaloflow-public-release"
          if ($LASTEXITCODE -ne 0) { throw 'Release archive failed integrity/source validation.' }
      - uses: actions/upload-artifact@v4
        if: steps.license_config.outputs.configured == 'true'
        with:
          name: ZaloFlow-Setup-Windows-x64
          path: desktop/dist/installer/
          if-no-files-found: error
          retention-days: 30
      - name: Publish complete code and Windows installer for direct public download
        if: github.ref == 'refs/tags/windows-owner-package-20261030-r2'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = 'windows-owner-package-20261030-r2'
          $releaseFolder = Join-Path $env:RUNNER_TEMP 'zaloflow-public-release'
          $draft = gh release view $releaseTag --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            if ($draft -ne 'true') { throw 'This release is already public; do not overwrite published files.' }
          } else {
            gh release create $releaseTag --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title 'ZaloFlow 30/10/2026 - Ma nguon va tool Windows' --notes-file "$releaseFolder/RELEASE-NOTES.md"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create release draft.' }
          }
          $assets = @(Get-ChildItem $releaseFolder -File | Where-Object { $_.Name -ne 'RELEASE-NOTES.md' } | ForEach-Object { $_.FullName })
          gh release upload $releaseTag @assets --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Cannot upload release files.' }
          gh release edit $releaseTag --draft=false --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish the checked release.' }
          gh release view $releaseTag --repo $env:GITHUB_REPOSITORY --json url,assets
