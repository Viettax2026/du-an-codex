name: Build Windows desktop
on:
  workflow_dispatch:
    inputs:
      license_config:
        description: 'Public client-config.json from the owner license server (never a private key)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'static/**'
      - 'connector/**'
      - 'tests/test_desktop_runtime.py'
      - 'tests/test_license_system.py'
      - 'runtime_lock.py'
      - 'license_system/**'
      - 'app.py'
      - 'campaign_actions.py'
      - 'campaign_schedule.py'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - name: Install desktop dependencies and test Windows lifecycle
        shell: pwsh
        run: |
          python -m pip install -r desktop/requirements.txt pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_desktop_runtime.py tests/test_license_system.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read public license configuration
        id: license_config
        env:
          ZALOFLOW_CLIENT_CONFIG: ${{ inputs.license_config }}
        run: python -m desktop.configure_build
      - name: Build native Windows package
        shell: pwsh
        run: ./desktop/build-windows.ps1 -AllowUnconfigured
      - name: Verify bundled public license configuration
        if: steps.license_config.outputs.configured == 'true'
        shell: pwsh
        run: |
          $expected = Get-Content desktop/license-config.json -Raw | ConvertFrom-Json
          $bundled = Get-Content desktop/dist/ZaloFlow/_internal/desktop/license-config.json -Raw | ConvertFrom-Json
          if ($bundled.version -ne $expected.version -or $bundled.server_url -ne $expected.server_url -or $bundled.public_key -ne $expected.public_key) { throw 'The packaged license authority does not match the owner configuration.' }
          $privateFiles = Get-ChildItem desktop/dist/ZaloFlow -Recurse -File | Where-Object { $_.Name -in @('signing-private.pem', 'admin-password.txt', 'session-secret.txt', 'licenses.sqlite3') }
          if ($privateFiles) { throw 'Private authority data must never be included in the customer package.' }
      - name: Smoke test packaged web server, scheduler and bundled Node
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'zaloflow-smoke.json'
          $process = Start-Process desktop/dist/ZaloFlow/ZaloFlow.exe -ArgumentList @('--smoke-test', '--smoke-report', $reportPath) -PassThru
          if (-not $process.WaitForExit(90000)) { Stop-Process -Id $process.Id -Force; throw 'Packaged smoke test timed out.' }
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke test failed.' }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.stopped -or -not $report.node_available -or -not $report.licensed) { throw 'Incomplete smoke test.' }
          Get-Content $reportPath
      - name: Smoke test native Edge WebView2 window
        shell: pwsh
        run: |
          $runtimePath = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/EdgeWebView/Application'
          if (-not (Test-Path $runtimePath)) {
            choco install webview2-runtime --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install WebView2 for GUI smoke test.' }
          }
          $reportPath = Join-Path $env:RUNNER_TEMP 'zaloflow-gui-smoke.json'
          $process = Start-Process desktop/dist/ZaloFlow/ZaloFlow.exe -ArgumentList @('--smoke-test', '--smoke-gui', '--smoke-report', $reportPath) -PassThru
          try {
            if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id -Force; throw 'Native window did not close.' }
            if ($process.ExitCode -ne 0) { throw 'Native Windows GUI smoke test failed.' }
          } catch {
            if (Test-Path "$reportPath.log") {
              $diagnostic = (Get-Content "$reportPath.log" -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Native window diagnostics::$diagnostic"
            }
            throw
          } finally {
            if (Test-Path "$reportPath.log") {
              Get-Content "$reportPath.log"
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content "$reportPath.log" >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.gui -or -not $report.stopped) { throw 'Incomplete GUI smoke test.' }
          Get-Content $reportPath
      - name: Build single-file Windows installer
        shell: pwsh
        run: |
          $compilerPath = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compilerPath)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install Inno Setup 6.' }
          }
          ./desktop/build-installer.ps1 -AppVersion "1.0.${{ github.run_number }}"
      - name: Test installer, shortcuts, upgrade and uninstall on Windows
        shell: pwsh
        run: ./desktop/test-installer.ps1
      - uses: actions/upload-artifact@v4
        if: steps.license_config.outputs.configured == 'true'
        with:
          name: ZaloFlow-Setup-Windows-x64
          path: desktop/dist/installer/
          if-no-files-found: error
          retention-days: 30
