name: Build portable web package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'templates/**'
      - 'static/**'
      - 'connector/**'
      - 'requirements*.txt'
      - 'web_deploy/**'
      - 'tests/test_web_deploy.py'
      - '.github/workflows/web-package.yml'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify configuration, package boundaries and script syntax
        run: |
          python -m pip install pytest
          python -m pytest tests/test_web_deploy.py -q
      - name: Build web source archive
        run: python -m web_deploy.package build
      - name: Test actual extracted package on Ubuntu 24.04 with Nginx, HTTPS, Node and Gunicorn
        run: |
          docker build --secret id=proxy_ca,src=/etc/ssl/certs/ca-certificates.crt -f web_deploy/smoke.Dockerfile -t zaloflow-web-smoke dist
          docker run --rm zaloflow-web-smoke
      - name: Prepare downloadable folder
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/zaloflow-web.zip') as archive:
              archive.extractall('dist/download')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zaloflow-web
          path: dist/download/
          if-no-files-found: error
          retention-days: 90
