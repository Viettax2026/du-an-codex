<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Quản lý bản quyền ZaloFlow{% endblock %}</title>
  <style>
    :root{--bg:#f5f7fc;--surface:#fff;--ink:#172b4d;--muted:#63738d;--line:#e4eaf3;--blue:#2563eb;--blue-soft:#edf3ff;--green:#087f5b;--red:#be3645;--radius:18px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button,summary{cursor:pointer}a{color:var(--blue)}button,input,summary{ -webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #94b8ff;outline-offset:3px}svg{width:19px;height:19px;flex:none;vertical-align:middle}h1,h2,p{margin:0}h1{font-size:30px;letter-spacing:-.8px;line-height:1.3}h2{font-size:18px;letter-spacing:-.3px}.muted{color:var(--muted)}.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.7px;color:var(--blue);margin-bottom:9px}
    .topbar{background:var(--surface);border-bottom:1px solid var(--line)}.topbar-inner{max-width:1344px;margin:auto;min-height:80px;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#397cff,#6256e8);color:#fff;display:grid;place-items:center;font-size:27px;font-weight:850;line-height:1;box-shadow:0 4px 10px #2563eb26}.brand-name{font-size:21px;font-weight:800;letter-spacing:-.6px}.brand-divider{height:25px;border-left:1px solid var(--line);margin:0 7px}.brand-section{color:var(--muted);font-size:13px}.header-actions{display:flex;align-items:center;gap:18px}.owner-label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.page{max-width:1344px;padding:36px 32px 26px;margin:auto}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.page-heading p{color:var(--muted);margin-top:9px}.private-badge{display:flex;align-items:center;gap:7px;background:#eaf7f1;color:var(--green);border:1px solid #d5ede1;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap}
    .button{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:42px;padding:9px 15px;border:1px solid transparent;border-radius:10px;font-weight:600;line-height:1.4;background:var(--blue);color:#fff;text-decoration:none;transition:background .15s,border-color .15s}.button:hover{background:#1d4ed8}.button-secondary{background:#fff;border-color:var(--line);color:var(--ink)}.button-secondary:hover{background:#f5f7fc;border-color:#cad5e5}.button-soft{background:var(--blue-soft);color:#225acb}.button-soft:hover{background:#dfebff}.button-danger{background:#fff5f5;border-color:#f3d3d7;color:var(--red)}.button-danger:hover{background:#ffe7e9;border-color:#e4adb5}.button-small{min-height:36px;padding:7px 11px;font-size:12px}.logout{font-size:12px}.flash{display:flex;gap:12px;padding:14px 18px;border:1px solid #cdddfa;border-radius:12px;background:#edf4ff;color:#24519b;margin-bottom:20px;overflow-wrap:anywhere}.flash svg{margin-top:2px}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:25px}.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:19px 21px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 3px 12px #1e3a5f03}.stat-label{font-size:12px;color:var(--muted);margin-bottom:6px}.stat-value{font-size:28px;font-weight:750;line-height:1.2;letter-spacing:-.8px}.stat-icon{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:var(--blue-soft);color:var(--blue)}.stat-green .stat-icon{background:#eaf8f1;color:var(--green)}.stat-amber .stat-icon{background:#fff6e5;color:#aa6c11}.stat-red .stat-icon{background:#fff0f1;color:var(--red)}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 18px #1e3a5f03;min-width:0}.create-layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:20px;margin-bottom:26px}.create-card{padding:24px}.card-heading{display:flex;align-items:center;gap:11px;margin-bottom:5px}.heading-icon{display:grid;place-items:center;width:33px;height:33px;background:var(--blue-soft);color:var(--blue);border-radius:10px}.card-description{font-size:13px;color:var(--muted)}.create-form{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;align-items:end;gap:12px;margin-top:21px}label.field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:600}input:not([type=checkbox]){width:100%;min-width:0;height:44px;border:1px solid #dce3ef;border-radius:10px;padding:10px 12px;color:var(--ink);background:#fff;transition:border-color .15s}input:not([type=checkbox]):focus{border-color:#6396f4}input::placeholder{color:#98a4b7}.required{color:var(--red)}.create-form .button{min-height:44px;white-space:nowrap}.info-card{background:linear-gradient(120deg,#f0f5ff,#f6f3ff);border:1px solid #e0e7fc;border-radius:var(--radius);padding:24px}.info-card h2{font-size:15px;display:flex;align-items:center;gap:9px;color:#3458a5;margin-bottom:11px}.info-card p{font-size:12px;color:#607297;margin-bottom:11px}.info-foot{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:#556b94}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
    .issued{padding:22px 24px;border-color:#b9e2d1;background:#f2fbf6;margin-bottom:22px}.issued h2{color:var(--green);margin-bottom:12px}.issued input{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.issued p{font-size:12px;color:#547666;margin-top:10px}
    .list-header{padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line)}.list-title{display:flex;align-items:center;gap:10px}.count{display:inline-grid;place-items:center;min-width:25px;height:25px;padding:0 8px;border-radius:8px;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:700}.list-header p{font-size:12px;color:var(--muted);margin-top:4px}.time-zone{font-size:11px;color:var(--muted);white-space:nowrap}table{border-collapse:collapse;width:100%;table-layout:fixed}thead{background:#f9fbfe}th{font-size:11px;color:#728099;font-weight:600;padding:13px 20px;text-align:left}td{padding:21px 20px;border-top:1px solid var(--line);vertical-align:top}th:first-child{width:28%}th:nth-child(2){width:17%}th:nth-child(3){width:16%}th:nth-child(4){width:10%}th:last-child{width:29%}tbody tr:first-child td{border-top:0}.customer{font-weight:650;overflow-wrap:anywhere;line-height:1.6;margin-bottom:6px}.license-id{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#f3f6fb;border:1px solid #e8edf5;padding:3px 7px;border-radius:5px;display:inline-block}.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:600;white-space:nowrap;background:#ebf8f1;color:var(--green)}.status-expired{background:#fff5e4;color:#95600b}.status-revoked{background:#fff0f1;color:#b53646}.expiry{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}.expiry-time{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:4px}.machines{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}.machines svg{width:16px;height:16px;color:#8492a9}.machines small{font-size:11px;color:var(--muted);font-weight:400}
    .extend-form label{font-size:11px;color:var(--muted);display:block;margin-bottom:7px}.extend-controls{display:flex;align-items:center;gap:7px}.extend-controls input:not([type=checkbox]){width:66px;height:36px;padding:6px 8px;font-size:12px}.extend-controls .button{flex:1}.manage{margin-top:11px}.manage summary{list-style:none;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);width:fit-content;padding:3px 0}.manage summary::-webkit-details-marker{display:none}.manage summary svg{width:14px;height:14px;transition:transform .15s}.manage[open] summary svg{transform:rotate(180deg)}.manage-content{padding-top:11px}.confirmation{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--muted);line-height:1.6}.confirmation input{width:15px;height:15px;margin:3px 0 0;accent-color:var(--blue);flex:none}.manage-buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.delete-form{border-top:1px solid var(--line);padding-top:13px;margin-top:14px}.delete-form .confirmation{color:#98515a}.delete-form .button{margin-top:10px}.empty{text-align:center;padding:48px 20px}.empty .stat-icon{margin:0 auto 13px}.empty h2{font-size:16px;margin-bottom:6px}.empty p{color:var(--muted);font-size:13px}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:22px;color:#8090a8;font-size:11px}.footer span:last-child{display:flex;align-items:center;gap:6px}
    .auth-page{max-width:470px;margin:8vh auto;padding:0 20px}.auth-card{padding:32px}.auth-card .eyebrow{margin-top:24px}.auth-card h1{font-size:26px}.auth-card p{color:var(--muted);font-size:13px;margin-top:12px}.auth-form{margin-top:26px}.auth-form .button{width:100%;margin-top:18px}.auth-note{margin-top:20px!important;font-size:12px!important;text-align:center}
    @media(min-width:1500px){.page{padding-top:42px}}
    @media(max-width:1100px){.create-layout{grid-template-columns:1fr}.info-card{padding:18px 22px}.info-card p{margin-bottom:6px}.create-form{grid-template-columns:minmax(0,1fr) 150px auto}.owner-label{display:none}th,td{padding-left:14px;padding-right:14px}th:first-child{width:24%}th:nth-child(2){width:17%}th:last-child{width:33%}.extend-controls{flex-wrap:wrap}.extend-controls .button{min-width:120px}}
    @media(max-width:760px){.topbar-inner{padding:14px 20px;min-height:72px}.brand-section,.brand-divider{display:none}.page{padding:26px 20px}.page-heading{align-items:flex-start}.page-heading h1{font-size:25px}.private-badge{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{padding:16px}.stat-value{font-size:25px}.stat-icon{width:36px;height:36px}.create-card{padding:20px}.create-form{grid-template-columns:minmax(0,1fr) 110px}.create-form .button{grid-column:1/-1}.list-header{padding:20px}.time-zone{display:none}table,tbody{display:block}thead{display:none}tbody tr{display:grid;grid-template-columns:1fr 1fr;padding:20px;gap:16px 12px;border-top:1px solid var(--line)}tbody tr:first-child{border-top:0}td{display:block;padding:0;border:0;min-width:0}td:before{content:attr(data-label);display:block;color:var(--muted);font-size:11px;margin-bottom:7px}td:first-child{grid-column:1/-1}.customer{margin-bottom:6px}td:first-child:before{display:none}td:last-child{grid-column:1/-1;background:#f9fbfe;border:1px solid var(--line);border-radius:12px;padding:14px}td:last-child:before{display:none}td:nth-child(4){grid-column:1/-1}.expiry-time{display:inline;margin-left:7px}.extend-controls input:not([type=checkbox]){width:82px}.extend-controls .button{flex:none}.manage summary{padding:5px 0}.empty{display:block;grid-column:1/-1}.empty:before{display:none}.footer{align-items:flex-start;flex-direction:column}.auth-page{margin-top:5vh}.auth-card{padding:25px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'key' %}<circle cx="8" cy="9" r="5"/><path d="m12 13 8 8m-3-3 3-3m-6 0 3-3"/>
{% elif name == 'shield' %}<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'ban' %}<circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/>
{% elif name == 'device' %}<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>
{% elif name == 'logout' %}<path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5m5-12 4 4-4 4m-7-4h11"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'chevron' %}<path d="m6 9 6 6 6-6"/>
{% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>
{% elif name == 'trash' %}<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>
{% endif %}</svg>
{%- endmacro %}
{% block body %}{% endblock %}
</body>
</html>
