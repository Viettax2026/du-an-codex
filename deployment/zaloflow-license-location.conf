# Managed by ZaloFlow license installer. Keep this service on loopback only.
location = /licenses {
    return 302 https://cskh.viettaxco.com/licenses/admin;
}
location /licenses/ {
    if ($scheme != https) {
        return 308 https://cskh.viettaxco.com$request_uri;
    }
    proxy_pass http://127.0.0.1:8010/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /licenses;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    client_max_body_size 8k;
}
