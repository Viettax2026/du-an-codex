{% extends 'base.html' %}{% block content %}<section class="panel form-panel"><h1>Thông tin cá nhân hóa</h1><p>{{ person.phone }}</p><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Tên khách hàng<input name="name" value="{{ person.name }}" maxlength="100" required></label><label>Email<input name="email" value="{{ person.email }}" maxlength="254"></label>{% for i in range(1,6) %}<label>Info{{ i }}<input name="info{{ i }}" value="{{ person['info' ~ i] }}" maxlength="500"></label>{% endfor %}<button class="primary">Lưu thông tin</button> <a href="/contacts">Hủy</a></form></section>{% endblock %}
