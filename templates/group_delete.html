{% extends 'base.html' %}
{% block content %}<section class="panel form-panel"><h1>Xóa nhóm “{{ name }}”</h1><p>Nhóm sẽ bị xóa vĩnh viễn và có thể tạo lại cùng tên. Hồ sơ khách hàng và lịch sử nguồn được giữ nguyên. Chiến dịch đang dùng nhóm sẽ giữ danh sách hiện tại, không nhận data từ nhóm tạo lại.</p><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="group" value="{{ name }}"><input type="hidden" name="group_id" value="{{ metadata.id if metadata else '' }}"><label class="send-confirm"><input type="checkbox" name="confirm_delete" value="yes" required> Tôi xác nhận xóa vĩnh viễn nhóm này.</label><div class="dialog-actions"><a class="ghost" href="{{ url_for('data_groups',group=name) }}">Hủy</a><button class="danger-button">Xóa nhóm</button></div></form></section>{% endblock %}
