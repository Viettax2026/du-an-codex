{% extends 'base.html' %}
{% block content %}<section class="panel form-panel"><h1>Xóa nhóm “{{ name }}”</h1><p>Nhóm sẽ được ẩn khỏi danh sách. Khách hàng, phiên Zalo và lịch sử chiến dịch được giữ nguyên; các chiến dịch đang dùng nhóm này vẫn hoạt động với dữ liệu cũ.</p><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="group" value="{{ name }}"><label class="send-confirm"><input type="checkbox" name="confirm_delete" value="yes" required> Tôi xác nhận ẩn nhóm này khỏi danh sách.</label><div class="dialog-actions"><a class="ghost" href="{{ url_for('data_groups',group=name) }}">Hủy</a><button class="danger-button">Xóa nhóm</button></div></form></section>{% endblock %}
