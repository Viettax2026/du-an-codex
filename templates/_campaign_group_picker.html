<dialog class="campaign-group-dialog" id="campaign-group-dialog" aria-labelledby="campaign-group-title" data-group-options-url="{{ url_for('campaign_group_options') }}" data-group-snapshot-url="{{ url_for('campaign_group_snapshot') }}">
<header><h2 id="campaign-group-title">Thêm bằng nhóm</h2><button type="button" data-close-campaign-group aria-label="Đóng">×</button></header>
<div class="campaign-group-dialog-body"><p>Chọn nhóm data để thêm dữ liệu hiện tại một lần. Chiến dịch không nhận data mới phát sinh trong nhóm.</p><div class="campaign-group-search"><input type="search" placeholder="Tìm nhóm data..." aria-label="Tìm nhóm data" data-campaign-group-search><button type="button" data-reload-campaign-groups>⟳ Tải lại</button></div><div class="campaign-group-options" role="radiogroup" aria-label="Nhóm data" data-campaign-group-options></div><p class="campaign-group-status" role="status" aria-live="polite" data-campaign-group-status></p></div>
<footer><button type="button" data-close-campaign-group>Hủy</button><button class="campaign-group-primary" type="button" data-choose-campaign-group disabled>Chọn nhóm</button></footer>
</dialog>
<script src="{{ url_for('static',filename='campaign-group-picker.js') }}" defer></script>
